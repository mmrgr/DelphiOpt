models:
  cheap:
    provider: mock
    model: mock-cheap
  strong:
    provider: mock
    model: mock-strong

# The desktop UI can reorder this list and enable priority-based fallback.
model_priority: [cheap, strong]
model_priority_enabled: false

seed: 0

experts:
  algorithm:
    persona: Algorithm Expert
    model_pool: [cheap, strong]
  compiler:
    persona: Compiler Expert
    model_pool: [cheap]
  systems:
    persona: Systems Expert
    model_pool: [cheap]
  memory:
    persona: Memory Expert
    model_pool: [cheap]
  skeptic:
    persona: Skeptic Agent
    model_pool: [strong]

scheduler:
  strategy: adaptive_voi
  base_tokens: 900
  tool_budget: 2
  max_parallel: 4
  # Delphi round one always asks every expert; later rounds may stop at this panel size.
  minimum_experts: 2

budget:
  max_cost_usd: 1.0
  max_tokens: 150000
  max_latency_seconds: 900
  max_llm_calls: 30
  # One measurement costs warmups + repetitions; a candidate comparison costs twice
  # that. 72 runs covers the baseline plus three interleaved comparisons.
  max_benchmark_runs: 72
  max_tool_calls: 120

delphi:
  max_rounds: 3
  disagreement_threshold: 0.08
  meaningful_speedup: 1.05
  max_coefficient_of_variation: 0.15
  marginal_gain_threshold: 0.02
  min_utility_per_usd: 0.1
  no_improvement_rounds: 2
  minority_bonus: 0.12
  candidate_weights:
    consensus: 0.25
    expected_gain: 0.25
    confidence: 0.20
    novelty: 0.12
    reputation: 0.10
    implementation_cost: 0.05
    correctness_risk: 0.03

benchmark:
  warmups: 2
  repetitions: 7
  bootstrap_resamples: 2000
  cpu_affinity: []
  timeout_seconds: 120

project:
  test_command: pytest -q
  benchmark_command: python benchmark.py
  lint_command:
  type_command:
  max_modified_files: 3

sandbox:
  type: local
  network: false
  cpu_limit: 2
  memory_mb: 2048
  image: python:3.12-slim
  # Local execution runs project-supplied commands through the host shell.
  # Set to false to refuse host execution, or use type: docker for untrusted projects.
  allow_host_execution: true
