name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests analysis benchmarks/generate_tasks.py
      - run: mypy src
      - run: pytest --cov=delphiopt --cov-report=term-missing --cov-fail-under=80 -q
