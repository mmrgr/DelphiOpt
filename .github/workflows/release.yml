name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests analysis benchmarks/generate_tasks.py
      - run: python -m mypy src
      - run: python -m pytest --cov=delphiopt --cov-fail-under=80 -q
