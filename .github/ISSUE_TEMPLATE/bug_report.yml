name: Bug report
description: Report a reproducible problem
title: "[bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, configuration, and error output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, commit, and provider.
    validations:
      required: true
