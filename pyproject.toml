[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delphiopt"
version = "0.1.0"
description = "Adaptive Delphi multi-agent runtime for budget-aware autonomous code optimization"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "DelphiOpt contributors"}]
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
delphiopt = "delphiopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
